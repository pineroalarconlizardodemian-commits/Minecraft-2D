<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Minecraft 2D</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
        canvas { display: block; width: 100%; height: 100%; touch-action: none; image-rendering: pixelated; }
        #hud {
            position: absolute; top: 10px; left: 10px;
            color: #fff; font-family: monospace; font-size: 14px;
            text-shadow: 2px 2px 0 #000; pointer-events: none;
        }
        #hotbar {
            position: absolute; bottom: 10px; left: 50%;
            transform: translateX(-50%); display: flex; gap: 4px;
            background: rgba(0,0,0,0.5); padding: 6px; border-radius: 6px;
        }
        .slot {
            width: 48px; height: 48px; border: 2px solid #555;
            display: flex; align-items: center; justify-content: center;
            font-size: 10px; color: #fff; font-family: monospace;
            background: rgba(255,255,255,0.1);
        }
        .slot.active { border-color: #fff; background: rgba(255,255,255,0.3); }
    </style>
</head>
<body>
    <canvas id="game"></canvas>
    <div id="hud">Bloque: <span id="selected">Tierra</span> | FPS: <span id="fps">0</span></div>
    <div id="hotbar"></div>
    <script src="js/blocks.js"></script>
    <script src="js/world.js"></script>
    <script src="js/player.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
